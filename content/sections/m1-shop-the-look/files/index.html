<link rel="stylesheet" href="look.css">
<figure id="look" class="look">
  <img src="hiker-ridge.webp" width="1800"
    height="1200" alt="A hiker on a ridge.">
  <button id="pin-shell" class="pin"
    command="toggle-popover"
    commandfor="card-shell"
    aria-label="Rain shell"></button>
  <button id="pin-pack" class="pin"
    command="toggle-popover"
    commandfor="card-pack"
    aria-label="Day pack 22 L"></button>
  <button id="pin-shoe" class="pin"
    command="toggle-popover"
    commandfor="card-shoe"
    aria-label="Ridgeline Trail"></button>
</figure>
<div id="card-shell" class="card" popover>
  <img src="rain-shell.webp" alt="">
  <h3>Rain shell</h3>
  <p>$149</p>
  <button>Add to cart</button>
</div>
<div id="card-pack" class="card" popover>
  <img src="day-pack-22.webp" alt="">
  <h3>Day pack 22 L</h3>
  <p>$89</p>
  <button>Add to cart</button>
</div>
<div id="card-shoe" class="card" popover>
  <img src="ridgeline-trail.webp" alt="">
  <h3>Ridgeline Trail</h3>
  <p>$129</p>
  <button>Add to cart</button>
</div>
