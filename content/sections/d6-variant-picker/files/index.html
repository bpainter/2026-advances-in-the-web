<link rel="stylesheet" href="select.css">
<form id="variant" class="variant"
  action="variants" method="post">
  <h1>Trail Runner 2</h1>
  <label for="color">Color</label>
  <select id="color" name="color">
    <button>
      <selectedcontent></selectedcontent>
    </button>
    <option value="black">
      <img src="black.webp" alt="">
      Black
    </option>
    <option value="moss">
      <img src="moss.webp" alt="">
      Moss
    </option>
    <option value="sand">
      <img src="sand.webp" alt="">
      Sand
    </option>
  </select>
  <button>Save</button>
</form>
<p id="status" role="status"></p>
<script type="module" src="app.js"></script>
