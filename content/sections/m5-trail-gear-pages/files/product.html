<link rel="stylesheet"
  href="transitions.css">
<main class="product">
  <img id="hero" class="hero"
    src="{{photo}}" alt="{{alt}}"
    style="view-transition-name:
      {{id}}-photo">
  <div class="product-info">
    <a href="index.html">Trail gear</a>
    <h1 style="view-transition-name:
      {{id}}-name">{{name}}</h1>
    <p class="price">{{price}}</p>
    <p>{{blurb}}</p>
  </div>
</main>
