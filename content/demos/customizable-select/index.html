<link rel="stylesheet" href="styles.css" />

<form>
  <label for="ship">Ships to</label>
  <div class="field">
    <select id="ship" name="country">
      <button>
        <selectedcontent></selectedcontent>
      </button>
      <option value="ca">
        <span class="flag ca"></span> Canada
      </option>
      <option value="jp">
        <span class="flag jp"></span> Japan
      </option>
      <option value="cl">
        <span class="flag cl"></span> Chile
      </option>
    </select>
    <div id="replica" class="replica">
      <p class="note note-open">
        Picker replica. The real one opens on a click.
      </p>
      <p class="note note-labels">
        Flag CSS off: the text is what is left.
      </p>
      <ul></ul>
    </div>
  </div>

  <button type="submit">Check out</button>
  <output id="sent"></output>
</form>

<script src="app.js"></script>
