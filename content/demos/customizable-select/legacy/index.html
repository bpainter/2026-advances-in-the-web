<link rel="stylesheet" href="styles.css" />

<form>
  <span class="label" id="ship-label">Ships to</span>
  <div class="field">
    <input type="hidden" name="country" value="ca" />
    <button
      type="button"
      id="ship"
      class="trigger"
      aria-haspopup="listbox"
      aria-expanded="false"
      aria-labelledby="ship-label ship"
    >
      <span class="flag ca"></span> Canada
    </button>
    <ul id="list" class="list" role="listbox" hidden>
      <li
        role="option"
        tabindex="-1"
        data-value="ca"
        aria-selected="true"
      >
        <span class="flag ca"></span> Canada
      </li>
      <li
        role="option"
        tabindex="-1"
        data-value="jp"
        aria-selected="false"
      >
        <span class="flag jp"></span> Japan
      </li>
      <li
        role="option"
        tabindex="-1"
        data-value="cl"
        aria-selected="false"
      >
        <span class="flag cl"></span> Chile
      </li>
    </ul>
  </div>

  <button type="submit">Check out</button>
  <output id="sent"></output>
</form>

<script src="app.js"></script>
