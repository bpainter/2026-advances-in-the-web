<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="card.css" />

<article class="card">
  <div class="hero">
    <span class="badge">Purchased</span>
  </div>
  <div class="row">
    <h2 class="title">Trail Runner 2</h2>
    <p class="price">$140</p>
  </div>
  <p class="meta">
    <label>
      Size
      <select class="size">
        <option>9</option>
        <option selected>10</option>
        <option>11 wide</option>
      </select>
    </label>
    · Delivered 18 Oct
  </p>
  <label for="review">Write a review</label>
  <div class="field">
    <textarea
      id="review"
      placeholder="How do they fit on the trail?"
    ></textarea>
    <span class="note"
      >No grip: the box sizes itself.</span
    >
  </div>
  <button type="button" class="btn">Post review</button>
</article>

<script src="app.js"></script>
