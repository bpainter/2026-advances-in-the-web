<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="card.css" />

<article class="card">
  <div class="hero"><span class="badge">New</span></div>
  <div class="row">
    <h2 class="title">Trail Runner 2</h2>
    <p class="price">$140</p>
  </div>
  <p class="meta">
    4.6 ★ · 212 reviews · Free shipping
  </p>
  <button type="button" class="btn">Add to bag</button>
</article>

<form class="theme">
  <label>
    Brand
    <input type="color" id="brand" value="#0c62fb" />
  </label>
  <label class="switch">
    <input type="checkbox" id="dark" />
    <span class="thumb"></span>
    Dark
  </label>
</form>

<script src="app.js"></script>
