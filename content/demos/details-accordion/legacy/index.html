<link rel="stylesheet" href="../card.css" />
<link rel="stylesheet" href="styles.css" />

<article class="card">
  <div class="hero"><span class="badge">New</span></div>
  <div class="row">
    <h2 class="title">Trail Runner 2</h2>
    <p class="price">$140</p>
  </div>
  <button type="button" class="btn">Add to bag</button>

  <section class="faq open" id="shipping">
    <button
      type="button"
      class="summary"
      aria-expanded="true"
    >
      Shipping
    </button>
    <div class="panel">
      <p>Free over $100. Arrives in 2 to 4 days.</p>
    </div>
  </section>
  <section class="faq" id="returns">
    <button
      type="button"
      class="summary"
      aria-expanded="false"
    >
      Returns
    </button>
    <div class="panel">
      <p>30 days, unworn, any reason.</p>
    </div>
  </section>
  <section class="faq" id="materials">
    <button
      type="button"
      class="summary"
      aria-expanded="false"
    >
      Materials
    </button>
    <div class="panel">
      <p>
        Recycled mesh upper. Vibram outsole, 4 mm lugs.
      </p>
    </div>
  </section>
</article>

<script src="app.js"></script>
