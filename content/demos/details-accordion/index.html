<article class="card">
  <div class="hero"><span class="badge">New</span></div>
  <div class="row">
    <h2 class="title">Trail Runner 2</h2>
    <p class="price">$140</p>
  </div>
  <button type="button" class="btn">Add to bag</button>

  <details class="faq" name="product" open>
    <summary>Shipping</summary>
    <p>Free over $100. Arrives in 2 to 4 days.</p>
  </details>
  <details class="faq" name="product">
    <summary>Returns</summary>
    <p>30 days, unworn, any reason.</p>
  </details>
  <details class="faq" name="product">
    <summary>Materials</summary>
    <p>
      Recycled mesh upper. Vibram outsole, 4 mm lugs.
    </p>
  </details>
</article>
