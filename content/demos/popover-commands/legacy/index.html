<link rel="stylesheet" href="../card.css" />
<link rel="stylesheet" href="styles.css" />

<article id="card" class="card">
  <div class="hero">
    <span class="badge">New</span>
    <span class="badge saved">Saved</span>
    <button
      type="button"
      class="more"
      aria-label="More options"
      aria-haspopup="menu"
      aria-expanded="false"
    >
      •••
    </button>
    <div id="menu" class="menu" role="menu" hidden>
      <button type="button" role="menuitem">
        Add to bag
      </button>
      <button
        type="button"
        class="save"
        role="menuitem"
      >
        Save for later
      </button>
      <button type="button" role="menuitem">
        Share
      </button>
    </div>
  </div>
  <div class="row">
    <h2 class="title">Trail Runner 2</h2>
    <p class="price">$140</p>
  </div>
  <p class="meta">
    4.6 ★ · 212 reviews · Free shipping
  </p>
  <button type="button" class="btn">Add to bag</button>
</article>

<script src="app.js"></script>
