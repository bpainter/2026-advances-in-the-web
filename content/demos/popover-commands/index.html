<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="card.css" />

<article id="card" class="card">
  <div class="hero">
    <span class="badge">New</span>
    <span class="badge saved">Saved</span>
    <button
      type="button"
      class="more"
      aria-label="More options"
      commandfor="menu"
      command="toggle-popover"
    >
      •••
    </button>
    <div id="menu" class="menu" popover>
      <button type="button">Add to bag</button>
      <button
        type="button"
        commandfor="card"
        command="--save"
      >
        Save for later
      </button>
      <button type="button">Share</button>
    </div>
  </div>
  <div class="row">
    <h2 class="title">Trail Runner 2</h2>
    <p class="price">$140</p>
  </div>
  <p class="meta">
    4.6 ★ · 212 reviews · Free shipping
  </p>
  <button type="button" class="btn">Add to bag</button>
</article>

<script src="app.js"></script>
