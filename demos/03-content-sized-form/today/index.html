<!-- prettier-ignore -->
<link rel="stylesheet" href="styles.css">
<form
  id="t-form"
  class="case-form"
  action="cases"
  method="post"
  novalidate
>
  <label for="t-subject">Subject</label>
  <input
    id="t-subject"
    name="subject"
    required
    maxlength="120"
    aria-describedby="t-subject-err"
  />
  <p
    id="t-subject-err"
    class="field-error"
    hidden
  ></p>
  <span
    id="t-mirror"
    aria-hidden="true"
  ></span>
  <label for="t-details">Details</label>
  <p id="t-hint">
    Steps, order number, and what you
    expected.
  </p>
  <textarea
    id="t-details"
    name="details"
    aria-describedby="t-hint t-details-err"
    rows="6"
    required
  ></textarea>
  <p
    id="t-details-err"
    class="field-error"
    hidden
  ></p>
  <button>Open case</button>
</form>
<p id="t-status" role="status"></p>
<script type="module" src="app.js"></script>
