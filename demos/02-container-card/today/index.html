<!-- prettier-ignore -->
<link rel="stylesheet" href="styles.css">
<main class="page">
  <header class="page__header">
    <p class="page__brand">
      Ridgeline Outfitters
    </p>
    <p class="page__nav">
      Trail · Road · Sale
    </p>
  </header>
  <section
    class="merch"
    aria-labelledby="merch-title"
  >
    <h2
      id="merch-title"
      class="section-title"
    >
      Featured
    </h2>
    <div class="merch__panel">
      <div
        id="t-merch"
        class="slot slot--merch"
      ></div>
    </div>
  </section>
  <div class="page__row">
    <section
      class="search"
      aria-labelledby="search-title"
    >
      <h2
        id="search-title"
        class="section-title"
      >
        Search results
      </h2>
      <div class="search__grid">
        <div
          id="t-grid"
          class="slot slot--grid"
        ></div>
      </div>
    </section>
    <aside
      class="rail"
      aria-labelledby="rail-title"
    >
      <h2
        id="rail-title"
        class="section-title"
      >
        Recommended
      </h2>
      <div
        id="t-rail"
        class="slot slot--rail"
      ></div>
    </aside>
  </div>
</main>
<script type="module" src="app.js"></script>
