<!-- prettier-ignore -->
<link rel="stylesheet" href="styles.css">
<main class="fx">
  <div class="fx-row">
    <div class="fx-t fx-r0" id="r0">0</div>
    <div class="fx-t fx-r8" id="r8">8</div>
    <div class="fx-t fx-r16" id="r16">16</div>
    <div class="fx-t fx-pill" id="pill">999</div>
  </div>
  <div class="fx-row">
    <div class="fx-t fx-mixed" id="mixed">12 12 0 0</div>
    <div class="fx-t fx-circle" id="circle">50%</div>
  </div>
  <div class="fx-row">
    <button type="button" class="fx-grow" id="grow">Grow</button>
  </div>
  <div class="fx-row">
    <div class="fx-panel" id="panel">Panel</div>
  </div>
</main>
<script src="hooks.js"></script>
